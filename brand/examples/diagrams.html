<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Select Creators diagrams</title><link rel="stylesheet" href="../../src/styles/tokens.css">
<style>body{margin:0;background:#050505;color:#e4e4e3;font-family:system-ui;padding:16px}</style></head><body class="sc-grain">
<img src="../logo/mark-animated.svg" width="72" height="72" alt="Select Creators">
<h2 style="font-size:32px;letter-spacing:-.03em;margin:8px 0">What a 100k creator <span class="sc-aurora-text">actually earns</span></h2>
<figure class="sc-figure"><div class="sc-stats">
<div class="sc-stat is-jade"><span class="sc-stat__value">$4,200</span><span class="sc-stat__label">Median monthly</span><span class="sc-stat__delta">+18% YoY</span></div>
<div class="sc-stat"><span class="sc-stat__value">3.1%</span><span class="sc-stat__label">Engagement</span></div>
<div class="sc-stat is-champagne"><span class="sc-stat__value">$850</span><span class="sc-stat__label">Per Reel</span></div>
<div class="sc-stat is-ion"><span class="sc-stat__value">41</span><span class="sc-stat__label">Contracts sampled</span></div></div>
<figcaption>Illustrative example</figcaption></figure>
<figure class="sc-figure"><ul class="sc-bars">
<li class="sc-bar is-ion" style="--v:72;--i:0"><div class="sc-bar__head">Brand deals<b>72%</b></div><div class="sc-bar__track"><div class="sc-bar__fill"></div></div></li>
<li class="sc-bar is-jade" style="--v:14;--i:1"><div class="sc-bar__head">Memberships<b>14%</b></div><div class="sc-bar__track"><div class="sc-bar__fill"></div></div></li>
<li class="sc-bar is-champagne" style="--v:9;--i:2"><div class="sc-bar__head">Affiliate<b>9%</b></div><div class="sc-bar__track"><div class="sc-bar__fill"></div></div></li>
<li class="sc-bar is-rose" style="--v:5;--i:3"><div class="sc-bar__head">Ad revenue<b>5%</b></div><div class="sc-bar__track"><div class="sc-bar__fill"></div></div></li></ul></figure>
<figure class="sc-figure"><ol class="sc-steps"><li><strong>Brief</strong><span>Brand sends deliverables and dates.</span></li><li class="is-active"><strong>Quote</strong><span>You price post, usage and exclusivity.</span></li><li><strong>Redline</strong><span>Cut perpetual usage and vague approvals.</span></li><li><strong>Invoice</strong><span>Net 30, 50% up front.</span></li></ol></figure>
<figure class="sc-figure"><div class="sc-flow"><div class="sc-flow__node is-cyan">Brand<small>Budget</small></div><div class="sc-flow__link"></div><div class="sc-flow__node is-amethyst">Agency<small>15–20%</small></div><div class="sc-flow__link"></div><div class="sc-flow__node is-jade">Creator<small>Net pay</small></div></div></figure>
<figure class="sc-figure"><div class="sc-compare"><div class="sc-compare__side is-ion"><h4>Manager</h4><ul><li>Runs your career day to day</li><li>10–20% of everything</li></ul></div><div class="sc-compare__side is-champagne"><h4>Agent</h4><ul><li>Finds and closes deals</li><li>10–20% of deals they book</li></ul></div></div>
<div style="display:flex;gap:16px;margin-top:16px;align-items:center"><div class="sc-donut is-rose" style="--v:62">62%</div><ul class="sc-legend"><li class="is-rose">Women 25–34</li><li>Other</li></ul></div></figure>
</body></html>
