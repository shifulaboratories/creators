<style>
  .seal { transform-origin: 32px 32px; animation: in .9s cubic-bezier(.16,1,.3,1) both; }
  .ring { transform-origin: 32px 32px; animation: spin 40s linear infinite; }
  .check { stroke-dasharray: 33.1; stroke-dashoffset: 33.1; animation: draw .7s cubic-bezier(.65,0,.35,1) .6s forwards; }
  .sheen { animation: sweep 5s cubic-bezier(.65,0,.35,1) 1.6s infinite; transform: translateX(-80px) skewX(-20deg); }
  @keyframes in { from { opacity: 0; transform: scale(.8) rotate(-30deg); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes sweep { 0% { transform: translateX(-80px) skewX(-20deg); } 30%, 100% { transform: translateX(110px) skewX(-20deg); } }
  @media (prefers-reduced-motion: reduce) { .seal, .ring, .check { animation: none; stroke-dashoffset: 0; opacity: 1; } .sheen { display: none; } }
</style>
