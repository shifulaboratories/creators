</defs>
<style>
  .plate { transform-origin: 32px 32px; animation: in .9s cubic-bezier(.16,1,.3,1) both; }
  .stroke { fill: none; stroke: url(#sc-ti); stroke-width: 4.8; stroke-linecap: butt; }
  .short { stroke-dasharray: 12.5; stroke-dashoffset: 12.5; animation: draw .35s cubic-bezier(.65,0,.35,1) .55s forwards; }
  .long { stroke-dasharray: 28.6; stroke-dashoffset: 28.6; animation: draw .5s cubic-bezier(.16,1,.3,1) .85s forwards; }
  .sheen { animation: sweep 5s cubic-bezier(.65,0,.35,1) 1.6s infinite; transform: translateX(-80px) skewX(-20deg); }
  @keyframes in { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes sweep { 0% { transform: translateX(-80px) skewX(-20deg); } 30%, 100% { transform: translateX(110px) skewX(-20deg); } }
  @media (prefers-reduced-motion: reduce) { .plate, .short, .long, .sheen { animation: none; stroke-dashoffset: 0; opacity: 1; } .sheen { display: none; } }
</style>
