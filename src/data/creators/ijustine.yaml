advice:
  - text: So even just having those spare videos for times when you need it is really crucial.
    source: https://vidiq.com/blog/post/ijustine-interview-how-to-rock-your-youtube-channel
    sourceTitle: "YouTube Superstar iJustine Interview: How to Rock Your Channel (vidIQ)"
    date: "2020"
  - text: Make videos that answer the questions people are searching for. That kind of video keeps getting found and becomes evergreen.
    quote: false
