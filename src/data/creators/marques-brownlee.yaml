advice:
  - text: Find your own new angle, your own new voice, your own new way of showing or talking about things.
    source: https://www.ycombinator.com/blog/marques-brownlee-on-building-an-audience-and-other-advice-for-creators
    sourceTitle: "Marques Brownlee on Building an Audience and Other Advice for Creators (Y Combinator)"
    date: "Mar 2019"
  - text: If it's 95% there and it's done, that's better than 99% there and still working on it.
    quote: false
    source: https://www.ycombinator.com/blog/marques-brownlee-on-building-an-audience-and-other-advice-for-creators
    sourceTitle: "Marques Brownlee on Building an Audience and Other Advice for Creators (Y Combinator)"
    date: "Mar 2019"
  - text: You have to diversify your income. That's the simple answer.
    source: https://www.ycombinator.com/blog/marques-brownlee-on-building-an-audience-and-other-advice-for-creators
    sourceTitle: "Marques Brownlee on Building an Audience and Other Advice for Creators (Y Combinator)"
    date: "Mar 2019"
  - text: Take a brand deal only when it is a win for the brand, for the channel and for the audience, who should get a better video out of it.
    quote: false
    source: https://business.google.com/us/think/search-and-video/marques-brownlee-interview/
    sourceTitle: "YouTube creator Marques Brownlee on building a production powerhouse (Think with Google)"
    date: "Sep 2025"
