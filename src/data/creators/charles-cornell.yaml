name: Charles Cornell
known: Music theory breakdowns and piano videos on YouTube
niche: music
platforms: [youtube, tiktok, instagram]
about: Charles Cornell is a pianist who makes music theory videos on YouTube. He built a library of paid piano courses and promotes them inside his own videos instead of relying on sponsors.
advice:
  - text: Creators should replace the word algorithm with audience when thinking about why videos do or do not perform.
    quote: false
    source: https://www.smartpassiveincome.com/session673
    sourceTitle: "SPI 673: Charles Cornell, YouTuber to Course Creator (Smart Passive Income)"
    date: "Apr 2023"
  - text: "I find that YouTube is very cyclical"
    source: https://www.smartpassiveincome.com/session673
    sourceTitle: "SPI 673: Charles Cornell, YouTuber to Course Creator (Smart Passive Income)"
    date: "Apr 2023"
  - text: Creators overreact to a few weak videos. Keep iterating, and avoid abrupt changes in content type, which he calls a death sentence for most channels.
    quote: false
    source: https://www.smartpassiveincome.com/session673
    sourceTitle: "SPI 673: Charles Cornell, YouTuber to Course Creator (Smart Passive Income)"
    date: "Apr 2023"
  - text: Ad revenue in his niche was never a big earner, and sponsor deals tied him to other people's goals, so he decided to become his own sponsor by selling courses and mentioning them in his videos.
    quote: false
    source: https://www.smartpassiveincome.com/session673
    sourceTitle: "SPI 673: Charles Cornell, YouTuber to Course Creator (Smart Passive Income)"
    date: "Apr 2023"
