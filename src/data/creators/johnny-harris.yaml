name: Johnny Harris
known: Long-form explainer and documentary journalism on YouTube
niche: education
platforms: [youtube]
about: Johnny Harris is a former Vox video journalist who makes long, highly produced explainer documentaries on YouTube. He co-founded Newpress, a company that supports journalist creators.
advice:
  - text: "Especially at the beginning, you have to be on a treadmill for a lot of years."
    source: https://www.journalism.co.uk/youtube-content-creator-johnny-harris-shows-how-independent-journalism-can-thrive/
    sourceTitle: "YouTube content creator Johnny Harris shows how independent journalism can thrive (Journalism UK)"
    date: "Apr 2025"
  - text: You have to publish a lot of stuff to win those views
    source: https://www.journalism.co.uk/youtube-content-creator-johnny-harris-shows-how-independent-journalism-can-thrive/
    sourceTitle: "YouTube content creator Johnny Harris shows how independent journalism can thrive (Journalism UK)"
    date: "Apr 2025"
  - text: Find the niche that lights you up, that you love, that you feel like you could do for decades.
    source: https://www.journalism.co.uk/youtube-content-creator-johnny-harris-shows-how-independent-journalism-can-thrive/
    sourceTitle: "YouTube content creator Johnny Harris shows how independent journalism can thrive (Journalism UK)"
    date: "Apr 2025"
