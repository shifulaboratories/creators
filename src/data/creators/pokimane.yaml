name: Pokimane
known: Variety streaming, YouTube videos and consumer brands
niche: gaming
platforms: [twitch, youtube]
about: Imane Anys, known as Pokimane, is a Moroccan-Canadian streamer who started on Twitch in 2013 while in high school. She has since added YouTube videos and consumer products to her streaming work.
