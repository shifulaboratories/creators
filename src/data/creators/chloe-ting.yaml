name: Chloe Ting
known: Free home workout programs and challenges on YouTube
niche: lifestyle
platforms: [youtube, instagram, twitch]
about: Chloe Ting is an Australian fitness creator whose free multi-week workout challenges took off on YouTube in 2020. She also live-streams and runs other projects with her team.
advice:
  - text: "I create free workout programs on my channel that take weeks of planning, training, filming and editing."
    source: https://www.herworld.com/wellness/fitness-youtuber-chloe-ting-detractors
    sourceTitle: "Chloe Ting on staying motivated and dealing with detractors (Her World)"
    date: "Dec 2020"
  - text: She works from a content framework but expects it to change often, because social platforms keep changing.
    quote: false
    source: https://www.herworld.com/wellness/fitness-youtuber-chloe-ting-detractors
    sourceTitle: "Chloe Ting on staying motivated and dealing with detractors (Her World)"
    date: "Dec 2020"
  - text: She does not give weight to negative opinions from people who barely know her or her values, and takes a social media detox when she needs one.
    quote: false
