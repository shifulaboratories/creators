name: Tom Scott
known: Educational YouTube videos, including ten years of weekly Things You Might Not Know
niche: education
platforms: [youtube]
about: Tom Scott is a British educational YouTuber who published a video every week for ten years before stepping back from the weekly schedule in 2024. His videos cover places, language, science and computing.
advice:
  - text: "But a dream job is still a job."
    source: https://www.tubefilter.com/2024/01/02/tom-scott-youtube-break/
    sourceTitle: "After 10 years of teaching the internet, Tom Scott is taking a break (Tubefilter)"
    date: "Jan 2024"
  - text: When a format has run its course, you can either push for bigger, more bombastic videos to chase views or scale back and make passion projects at a cost. He chose to scale back.
    quote: false
    source: https://www.tubefilter.com/2024/01/02/tom-scott-youtube-break/
    sourceTitle: "After 10 years of teaching the internet, Tom Scott is taking a break (Tubefilter)"
    date: "Jan 2024"
  - text: Make room for work that is "experimental and weird and can fail", because a weekly schedule squeezes it out.
    quote: false
    source: https://www.tubefilter.com/2024/01/02/tom-scott-youtube-break/
    sourceTitle: "After 10 years of teaching the internet, Tom Scott is taking a break (Tubefilter)"
    date: "Jan 2024"
