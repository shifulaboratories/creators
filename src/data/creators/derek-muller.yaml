name: Derek Muller
known: Science and engineering videos on YouTube as the creator of Veritasium
niche: education
platforms: [youtube]
site: https://www.veritasium.com/
about: Derek Muller is a physicist and science communicator who created the Veritasium YouTube channel. His PhD research looked at what makes physics videos effective for learning.
advice:
  - text: Address the audience's misconceptions directly. "If you don't tap in to them, it's easy for people to watch a video and think they're understanding it."
    quote: false
    source: https://sydney.edu.au/news-opinion/news/2024/11/05/the-element-of-truth.html
    sourceTitle: "The element of truth (University of Sydney)"
    date: "Nov 2024"
  - text: Experiment. Try lots of different things and get a sense of where your efforts are resonating with the world.
    quote: false
    source: https://sydney.edu.au/news-opinion/news/2024/11/05/the-element-of-truth.html
    sourceTitle: "The element of truth (University of Sydney)"
    date: "Nov 2024"
  - text: Listen to your gut. If something does not feel like it is working for you, change it.
    quote: false
    source: https://sydney.edu.au/news-opinion/news/2024/11/05/the-element-of-truth.html
