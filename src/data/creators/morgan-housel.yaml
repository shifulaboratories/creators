name: Morgan Housel
known: Essays on money and behavior, author of The Psychology of Money
niche: business
platforms: [newsletter, x]
about: A writer and partner at Collaborative Fund whose blog essays on money and behavior grew into the book The Psychology of Money. He previously wrote for The Motley Fool and The Wall Street Journal.
advice:
  - text: "I call this selfish writing. I'm writing for an audience of one, and that is me."
    source: https://tim.blog/2022/03/05/morgan-housel-the-psychology-of-money-transcript/
    sourceTitle: "Morgan Housel (The Tim Ferriss Show transcript)"
    date: "Mar 2022"
  - text: "I think a lot of writers get into trouble by asking themselves: \"What does my audience want to read?\""
    source: https://tim.blog/2022/03/05/morgan-housel-the-psychology-of-money-transcript/
    sourceTitle: "Morgan Housel (The Tim Ferriss Show transcript)"
    date: "Mar 2022"
  - text: "branding it after yourself and being explicit about that is the right way to go in content these days, because people want to interact with a person."
    source: https://tim.blog/2022/03/05/morgan-housel-the-psychology-of-money-transcript/
    sourceTitle: "Morgan Housel (The Tim Ferriss Show transcript)"
    date: "Mar 2022"
  - text: Post on social media sparingly, about once a day or less, and only when a post is worth reading.
    quote: false
    source: https://tim.blog/2022/03/05/morgan-housel-the-psychology-of-money-transcript/
    sourceTitle: "Morgan Housel (The Tim Ferriss Show transcript)"
    date: "Mar 2022"
