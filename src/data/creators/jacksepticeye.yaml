name: Jacksepticeye
known: Let's plays and gaming commentary on YouTube
niche: gaming
platforms: [youtube, tiktok]
about: Sean McLoughlin is an Irish gaming creator who started his channel in 2012 and uploaded two videos a day for about five years. He later hired an editor and cut back his output to focus on quality.
advice:
  - text: "But it was two videos every day for five years, then getting an editor, then scaling up the quality"
    source: https://www.inverse.com/gaming/jacksepticeye-interview-how-did-i-get-here-documentary
    sourceTitle: "Jacksepticeye interview on his documentary How Did I Get Here (Inverse)"
    date: "Mar 2022"
  - text: "But I also think it's important to keep challenging what you think you're supposed to be uploading."
    source: https://www.inverse.com/gaming/jacksepticeye-interview-how-did-i-get-here-documentary
    sourceTitle: "Jacksepticeye interview on his documentary How Did I Get Here (Inverse)"
    date: "Mar 2022"
  - text: "As long as I keep chatting to my audience, they'll point me in the right direction and we'll keep having fun with it."
    source: https://www.inverse.com/gaming/jacksepticeye-interview-how-did-i-get-here-documentary
    sourceTitle: "Jacksepticeye interview on his documentary How Did I Get Here (Inverse)"
    date: "Mar 2022"
  - text: "When there's less pressure on it, I'm not trying to chase too many trends or appease too many algorithms"
    source: https://www.inverse.com/gaming/jacksepticeye-interview-how-did-i-get-here-documentary
    sourceTitle: "Jacksepticeye interview on his documentary How Did I Get Here (Inverse)"
    date: "Mar 2022"
