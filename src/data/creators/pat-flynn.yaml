advice:
  - text: "Quantity is key."
    source: https://nathanbarry.com/?p=7111
    sourceTitle: "From Zero To $1M From Content: My 2025 Strategy (Pat Flynn), Nathan Barry Show 090"
    date: "Aug 2025"
  - text: Link videos into multi-part story arcs. People subscribe to see what happens next, not because they liked the video they just watched.
    quote: false
    source: https://nathanbarry.com/?p=7111
    sourceTitle: "From Zero To $1M From Content: My 2025 Strategy (Pat Flynn), Nathan Barry Show 090"
    date: "Aug 2025"
  - text: Use retention graphs to cut what loses viewers. Dropping his own intro and opening straight on the reveal improved retention.
    quote: false
    source: https://nathanbarry.com/?p=7111
    sourceTitle: "From Zero To $1M From Content: My 2025 Strategy (Pat Flynn), Nathan Barry Show 090"
    date: "Aug 2025"
  - text: Spend about 20 percent of your time on experiments, and judge a new channel by whether you kept uploading, not by its early views.
    quote: false
    source: https://nathanbarry.com/?p=7111
    sourceTitle: "From Zero To $1M From Content: My 2025 Strategy (Pat Flynn), Nathan Barry Show 090"
    date: "Aug 2025"
