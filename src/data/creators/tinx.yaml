name: Tinx
known: Big-sister dating and lifestyle advice on TikTok and podcasts
niche: lifestyle
platforms: [tiktok, instagram, podcast]
about: Christina Najjar, known as Tinx, became known on TikTok for candid dating and life advice in a big-sister voice. She has since expanded into podcasting and brand collaborations.
advice:
  - text: "I never want to promote any brands that I haven't talked about naturally or that I don't really love"
    source: https://www.glossy.co/beauty/tinx-christina-najjar-glossy-50
    sourceTitle: "Tinx, Glossy 50 (Glossy)"
    date: "Dec 2021"
  - text: "Audiences are smart, and they can tell when an influencer is just in a cash grab"
    source: https://www.glossy.co/beauty/tinx-christina-najjar-glossy-50
    sourceTitle: "Tinx, Glossy 50 (Glossy)"
    date: "Dec 2021"
  - text: "Influencers need to take their job even more seriously, because we're influencing people on how to spend their money."
    source: https://www.glossy.co/beauty/christina-tinx-najjar-in-this-economy-influencers-need-to-take-their-job-more-seriously
    sourceTitle: "Tinx: In this economy, influencers need to take their job more seriously (Glossy)"
    date: "Dec 2022"
  - text: Match the platform to the job. She sees Instagram as the shopping app, while podcast audio is more intimate than a short-form video.
    quote: false
    source: https://www.glossy.co/beauty/christina-tinx-najjar-in-this-economy-influencers-need-to-take-their-job-more-seriously
    sourceTitle: "Tinx: In this economy, influencers need to take their job more seriously (Glossy)"
    date: "Dec 2022"
