name: Noah Kagan
known: AppSumo founder making YouTube videos on starting small businesses
niche: business
platforms: [youtube, newsletter, podcast]
site: https://noahkagan.com/
about: The founder of AppSumo and author of Million Dollar Weekend. He grew a YouTube channel about starting and growing businesses past 1 million subscribers with a small team while still running AppSumo.
advice:
  - text: "what's the content I can do over and over and over and over that my, my audience will respond well to."
    source: https://thenathanbarryshow.transistor.fm/episodes/noah-kagan/transcript
    sourceTitle: "How I Actually Grew To 1M+ Subscribers On YouTube (The Nathan Barry Show, Ep 114)"
    date: "Feb 2026"
  - text: You can't know in advance what will work. Test many formats, then keep the few that perform.
    quote: false
    source: https://thenathanbarryshow.transistor.fm/episodes/noah-kagan/transcript
    sourceTitle: "How I Actually Grew To 1M+ Subscribers On YouTube (The Nathan Barry Show, Ep 114)"
    date: "Feb 2026"
  - text: "I don't think the audience ever cared about me."
    source: https://thenathanbarryshow.transistor.fm/episodes/noah-kagan/transcript
    sourceTitle: "How I Actually Grew To 1M+ Subscribers On YouTube (The Nathan Barry Show, Ep 114)"
    date: "Feb 2026"
  - text: Build the team gradually. It started as him and one collaborator, and they added roles one at a time as the channel needed them. Pace yourself too, since sprinting at 20 to 30 hours a week on top of a company led him to burn out.
    quote: false
    source: https://thenathanbarryshow.transistor.fm/episodes/noah-kagan/transcript
    sourceTitle: "How I Actually Grew To 1M+ Subscribers On YouTube (The Nathan Barry Show, Ep 114)"
    date: "Feb 2026"
