name: Ann Handley
known: Total Annarchy newsletter and the writing guide Everybody Writes
niche: business
platforms: [newsletter]
site: https://annhandley.com/
about: A marketing writer and author of Everybody Writes who publishes the Total Annarchy newsletter on writing and marketing. She was a co-founder of ClickZ and long-time Chief Content Officer at MarketingProfs.
advice:
  - text: Write each newsletter for one real person, often someone whose question came in from your list.
    quote: false
    source: https://podcast.creatorscience.com/ann-handley/
    sourceTitle: "Ann Handley (Creator Science, #94)"
    date: "Mar 2022"
  - text: Ask new subscribers how they found you and what they hope to learn. Then measure success by how many readers write back, aiming for around 100 replies an issue, without explicitly asking for them.
    quote: false
    source: https://podcast.creatorscience.com/ann-handley/
    sourceTitle: "Ann Handley (Creator Science, #94)"
    date: "Mar 2022"
  - text: "I always, always, always read it out loud"
    source: https://podcast.creatorscience.com/ann-handley/
    sourceTitle: "Ann Handley (Creator Science, #94)"
    date: "Mar 2022"
  - text: Keep drafting and editing separate. Let a draft sit before you edit it, but set firm deadlines so you still ship.
    quote: false
    source: https://podcast.creatorscience.com/ann-handley/
    sourceTitle: "Ann Handley (Creator Science, #94)"
    date: "Mar 2022"
