name: Ankur Warikoo
known: Money, career and entrepreneurship content for India across YouTube and Instagram
niche: business
platforms: [youtube, instagram, linkedin]
about: An entrepreneur and former CEO of nearbuy who now makes content on money, careers and starting up for an Indian audience. He also runs online courses and wrote the book Do Epic Shit.
advice:
  - text: "If you are consistent, the algorithm of the platform and the audience will reward you."
    source: https://www.entrepreneur.com/article/411110
    sourceTitle: "The Experiential Coach (Entrepreneur India)"
    date: "Jan 2022"
  - text: "If you do not have to become anyone else to do what you do, you will never struggle to be consistent."
    source: https://www.entrepreneur.com/article/411110
    sourceTitle: "The Experiential Coach (Entrepreneur India)"
    date: "Jan 2022"
  - text: Treat each platform differently. Instagram is quick consumption for a younger audience, YouTube is long form, and LinkedIn is text for working professionals. Master one platform before expanding to others.
    quote: false
    source: https://www.entrepreneur.com/article/411110
    sourceTitle: "The Experiential Coach (Entrepreneur India)"
    date: "Jan 2022"
  - text: "I pay attention to the message and not the messenger."
    source: https://www.entrepreneur.com/article/411110
    sourceTitle: "The Experiential Coach (Entrepreneur India)"
    date: "Jan 2022"
