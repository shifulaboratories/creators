name: Airrack
known: Big stunt and challenge videos on YouTube, co-founder of Creator Now
niche: entertainment
platforms: [youtube]
about: Airrack is the channel name of Eric Decker, who makes large-scale stunt and challenge videos on YouTube. He also co-founded Creator Now, a course and community for aspiring YouTubers.
advice:
  - text: If you want to do a collaboration, the other person has to gain more from it than you do.
    quote: false
    source: https://omr.com/de/daily/airrack-youtube-growth-hacks/
    sourceTitle: "How Airrack reached 10 million subscribers (OMR, in German)"
    date: "Nov 2022"
  - text: Early on he grew through what he calls social hacking, asking viewers to share his videos everywhere and giving subscribers personal referral links.
    quote: false
    source: https://omr.com/de/daily/airrack-youtube-growth-hacks/
    sourceTitle: "How Airrack reached 10 million subscribers (OMR, in German)"
    date: "Nov 2022"
  - text: "It can feel very lonely to try to become a creator by yourself"
    source: https://www.tubefilter.com/2021/06/17/airrack-launches-creator-now-course-for-aspiring-youtubers/
    sourceTitle: "Airrack launches Creator Now course for aspiring YouTubers (Tubefilter)"
    date: "Jun 2021"
