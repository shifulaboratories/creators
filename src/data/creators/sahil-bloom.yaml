about: A former investor who writes a weekly newsletter and short social posts on personal growth and business. He is also the author of The 5 Types of Wealth.
advice:
  - text: Repurpose your past content aggressively. Resharing a strong idea every few months works because it keeps reaching new people.
    quote: false
    source: https://nathanbarry.com/078-sahil-bloom-using-flywheels-to-build-longevity-in-the-creator-economy/
    sourceTitle: "Sahil Bloom: Using flywheels to build longevity in the creator economy (Nathan Barry podcast)"
    date: "Jul 2023"
  - text: On X the opening is quality, not volume. Chasing vanity metrics just to grow bigger tends to disappoint.
    quote: false
    source: https://nathanbarry.com/078-sahil-bloom-using-flywheels-to-build-longevity-in-the-creator-economy/
    sourceTitle: "Sahil Bloom: Using flywheels to build longevity in the creator economy (Nathan Barry podcast)"
    date: "Jul 2023"
  - text: Protect your mornings for writing, when your creative energy is highest, and treat writing as the most important part of the job.
    quote: false
    source: https://nathanbarry.com/078-sahil-bloom-using-flywheels-to-build-longevity-in-the-creator-economy/
    sourceTitle: "Sahil Bloom: Using flywheels to build longevity in the creator economy (Nathan Barry podcast)"
    date: "Jul 2023"
  - text: Be slow to take partnerships. Working with a brand that doesn't resonate with your audience is the worst outcome.
    quote: false
