name: Nikkie de Jager
known: Makeup tutorials on YouTube as NikkieTutorials, founder of Nimya
niche: beauty
platforms: [youtube, instagram]
about: Nikkie de Jager is a Dutch makeup artist who started posting tutorials as NikkieTutorials in 2008. She later launched her own beauty brand, Nimya, which she funds herself.
advice:
  - text: "I upload twice a week (Wednesdays and Sundays) with sometimes an extra video going up on Friday."
    source: https://www.tubefilter.com/2016/06/16/youtube-millionaires-nikkie-tutorials/
    sourceTitle: "YouTube Millionaires: NikkieTutorials (Tubefilter)"
    date: "Jun 2016"
  - text: She started her brand to fill gaps she kept running into as a makeup artist. When she could not find the right formula or product, she tried to make it herself.
    quote: false
    source: https://www.glossy.co/beauty/nikkie-de-jager-nimya-influencer-brand-to-know/
    sourceTitle: "Nikkie de Jager on Nimya (Glossy)"
    date: "Jul 2023"
  - text: "So not having that pressure as an indie-brand really empowers me to launch whenever we want and can."
    source: https://www.glossy.co/beauty/nikkie-de-jager-nimya-influencer-brand-to-know/
    sourceTitle: "Nikkie de Jager on Nimya (Glossy)"
    date: "Jul 2023"
  - text: She has no investors besides herself, which keeps her in full control and lets the brand release only products she thinks are good enough.
    quote: false
    source: https://www.glossy.co/beauty/nikkie-de-jager-nimya-influencer-brand-to-know/
    sourceTitle: "Nikkie de Jager on Nimya (Glossy)"
    date: "Jul 2023"
