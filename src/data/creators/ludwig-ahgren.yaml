name: Ludwig Ahgren
known: Comedy livestreams, big live events and YouTube videos
niche: gaming
platforms: [youtube, podcast]
about: A streamer and YouTuber who set a Twitch subscriber record with a month-long subathon in 2021 and later moved his streams to YouTube. He is known for large, produced live events alongside his regular streams.
advice:
  - text: "I put everything that I make back into the business, and then I draw a salary."
    source: https://www.inverse.com/gaming/ludwig-ahgren-luminaries-2022
    sourceTitle: "Super-streamer Ludwig Ahgren hates the same awful gaming trends that you do (Inverse)"
    date: "Aug 2022"
  - text: "I'm capping myself if I'm only streaming these events on YouTube, or if I'm only streaming them on Twitch."
    source: https://www.tubefilter.com/2023/12/04/ludwig-ahgren-twitch-youtube-tiktok/
    sourceTitle: "Ludwig isn't happy with how YouTube is handling livestreams (Tubefilter)"
    date: "Dec 2023"
  - text: Being skilled at a game only gets you a certain audience. Being a consistent personality viewers can unwind with is what lets a stream grow beyond that.
    quote: false
    source: https://www.inverse.com/gaming/ludwig-ahgren-luminaries-2022
    sourceTitle: "Super-streamer Ludwig Ahgren hates the same awful gaming trends that you do (Inverse)"
    date: "Aug 2022"
