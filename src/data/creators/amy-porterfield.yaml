name: Amy Porterfield
known: Online Marketing Made Easy podcast on email lists, courses and launches
niche: business
platforms: [podcast, newsletter, youtube]
site: https://www.amyporterfield.com/
about: A former corporate marketer who teaches list building, webinars and digital course launches through her long-running podcast and paid programs. She is the author of Two Weeks Notice.
tools:
  - name: Leadpages
    use: Her tool of choice for list-building landing pages and opt-in boxes
    source: https://www.amyporterfield.com/?p=32835
    sourceTitle: "Transcript: Growing a Lucrative Email List (Online Marketing Made Easy)"
    date: "Nov 2015"
  - name: Infusionsoft (now Keap)
    use: Email service provider, tagging subscribers by the freebie they signed up for
    source: https://www.amyporterfield.com/?p=32835
    sourceTitle: "Transcript: Growing a Lucrative Email List (Online Marketing Made Easy)"
    date: "Nov 2015"
  - name: MeetEdgar
    use: Schedules and recycles social media posts
    source: https://www.amyporterfield.com/?p=32835
    sourceTitle: "Transcript: Growing a Lucrative Email List (Online Marketing Made Easy)"
    date: "Nov 2015"
advice:
  - text: "consistency is going to beat out anything else you do when it comes to list building."
    source: https://www.amyporterfield.com/?p=32835
    sourceTitle: "Transcript: Growing a Lucrative Email List (Online Marketing Made Easy)"
    date: "Nov 2015"
  - text: Make your main freebie closely match what you ultimately plan to sell, so the people who sign up are the people who will buy.
    quote: false
    source: https://www.amyporterfield.com/?p=32835
    sourceTitle: "Transcript: Growing a Lucrative Email List (Online Marketing Made Easy)"
    date: "Nov 2015"
  - text: "You do not need to have a list of 100,000 people in order to make money online."
    source: https://www.amyporterfield.com/?p=32835
    sourceTitle: "Transcript: Growing a Lucrative Email List (Online Marketing Made Easy)"
    date: "Nov 2015"
