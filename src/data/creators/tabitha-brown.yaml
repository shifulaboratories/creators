name: Tabitha Brown
known: Vegan cooking and feel-good videos on TikTok, author and entrepreneur
niche: lifestyle
platforms: [tiktok, instagram, youtube]
about: Tabitha Brown is an actor who became widely known for warm, conversational vegan cooking videos on TikTok. She has since built a range of businesses and product lines that she owns outright.
caseStudy: case-studies/tabitha-brown
advice:
  - text: "The only reason that you want to get investors is if you need it."
    source: https://afrotech.com/tabitha-browns-decision-to-bootstrap-her-businesses
    sourceTitle: "Tabitha Brown on bootstrapping her businesses (AfroTech)"
    date: "Sep 2025"
  - text: "I don't foresee wanting to get investors, because then you kind of start losing a little bit of your control."
    source: https://afrotech.com/tabitha-browns-decision-to-bootstrap-her-businesses
    sourceTitle: "Tabitha Brown on bootstrapping her businesses (AfroTech)"
    date: "Sep 2025"
  - text: "You can't do business with everybody. You just can't, but you have to live and learn."
    source: https://afrotech.com/tabitha-browns-decision-to-bootstrap-her-businesses
    sourceTitle: "Tabitha Brown on bootstrapping her businesses (AfroTech)"
    date: "Sep 2025"
  - text: She shelved a planned restaurant partnership after realizing she could not be as present as she wanted. If she has a restaurant, it has to be hers and she would want to be there.
    quote: false
    source: https://www.fastcompany.com/90873390/tabitha-brown-seen-loved-heard-entertainment-empire-joy
    sourceTitle: "Tabitha Brown's entertainment empire (Fast Company)"
    date: "Apr 2023"
