name: Jackie Aina
known: Inclusive beauty on YouTube, co-founder of FORVR Mood
niche: beauty
platforms: [youtube, instagram, tiktok]
about: Jackie Aina built her audience with makeup techniques for a wide range of skin tones and by pushing the beauty industry on inclusivity. She co-founded the self-care brand FORVR Mood.
advice:
  - text: "I launched FORVR Mood for fans who wanted to try things that I recommended and love things that I do"
    source: https://www.glossy.co/beauty/jackie-aina-forevr-mood-influencer-brand/
    sourceTitle: "Jackie Aina on FORVR Mood (Glossy)"
    date: "Feb 2022"
  - text: "It's about reeducating how we grind. I don't just grind with my content; I also grind with my mental health and self-care."
    source: https://www.refinery29.com/en-gb/2020/08/9958115/jackie-aina-forvr-mood-candles-brand-interview
    sourceTitle: "Jackie Aina on launching FORVR Mood (Refinery29)"
    date: "Aug 2020"
  - text: "Starting a business or even doing something unconventional is probably going to garner a lot of criticism."
    source: https://www.refinery29.com/en-gb/2020/08/9958115/jackie-aina-forvr-mood-candles-brand-interview
    sourceTitle: "Jackie Aina on launching FORVR Mood (Refinery29)"
    date: "Aug 2020"
