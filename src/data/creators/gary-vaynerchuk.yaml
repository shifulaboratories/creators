name: Gary Vaynerchuk
known: GaryVee, high-volume business and marketing content across every platform
niche: business
platforms: [youtube, podcast, instagram, tiktok, x]
site: https://garyvaynerchuk.com/
about: Gary Vaynerchuk is the chairman of VaynerX and CEO of VaynerMedia who built an audience on business and marketing content. His team popularized turning one long-form piece into many platform-specific clips.
advice:
  - text: Start with one piece of pillar content, such as a keynote, a long interview or a show episode, and build everything else from it. He calls this a reverse pyramid model.
    quote: false
    source: https://garyvaynerchuk.com/the-garyvee-content-strategy-how-to-grow-and-distribute-your-brands-social-media-content/
    sourceTitle: "The GaryVee Content Strategy: How to Grow and Distribute Your Brand's Social Media Content"
    date: "Jan 2019"
  - text: "“Micro content” is created from each episode and is used to drive awareness back to the original long-form content."
    source: https://garyvaynerchuk.com/the-garyvee-content-strategy-how-to-grow-and-distribute-your-brands-social-media-content/
    sourceTitle: "The GaryVee Content Strategy: How to Grow and Distribute Your Brand's Social Media Content"
    date: "Jan 2019"
  - text: Cut each long piece into dozens of smaller pieces and adapt each one to the platform it is posted on, rather than posting the same file everywhere.
    quote: false
    source: https://garyvaynerchuk.com/the-garyvee-content-strategy-how-to-grow-and-distribute-your-brands-social-media-content/
    sourceTitle: "The GaryVee Content Strategy: How to Grow and Distribute Your Brand's Social Media Content"
    date: "Jan 2019"
