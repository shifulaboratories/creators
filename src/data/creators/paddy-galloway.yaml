name: Paddy Galloway
known: YouTube strategist for MrBeast, Ryan Trahan and others
niche: strategy
platforms: [youtube, x]
about: A YouTube consultant from Ireland who has advised some of the biggest channels. He also founded YT Jobs, a job board for YouTube teams.
advice:
  - text: "A 20% better title could mean double, triple, quadruple."
    source: https://creatorscience.com/podcast/paddy-galloway-2/
    sourceTitle: "Creator Science podcast, episode 209"
    date: "Sep 2024"
  - text: "a great idea has to be easy to convey in a title thumbnail."
    source: https://creatorscience.com/podcast/paddy-galloway-2/
    sourceTitle: "Creator Science podcast, episode 209"
    date: "Sep 2024"
  - text: "The difference between a million views and 28 million views is how you package it."
    source: https://www.colinandsamir.com/resources/the-new-rules-of-youtube-from-paddy-galloway
    sourceTitle: "The New Rules of YouTube, on the Colin and Samir Show"
    date: "Apr 2025"
