name: Valkyrae
known: Variety and GTA roleplay livestreams on YouTube
niche: gaming
platforms: [youtube]
about: Rachell Hofstetter, known as Valkyrae, is a variety streamer and a co-owner of the esports and lifestyle company 100 Thieves. Before streaming full time she worked at GameStop and streamed after her shifts.
advice:
  - text: "The advice I give to a lot of people that are striving to become a streamer or a YouTuber is that you can't act."
    source: https://kotaku.com/valkyrae-rachell-hofstetter-family-plan-apple-interview-1851243875
    sourceTitle: "Valkyrae On The Family Plan, Working Retail, And How To Stream Authentically (Kotaku)"
    date: "Feb 2024"
  - text: "If you're faking it, people can tell if you're doing it for money."
    source: https://kotaku.com/valkyrae-rachell-hofstetter-family-plan-apple-interview-1851243875
    sourceTitle: "Valkyrae On The Family Plan, Working Retail, And How To Stream Authentically (Kotaku)"
    date: "Feb 2024"
  - text: Once your hobby is your career, protect it from burnout by limiting gaming when you travel and keeping real life in balance.
    quote: false
    source: https://ca.rollingstone.com/culture/how-valkyraes-imaginary-relationship-with-a-killer-clown-became-a-streaming-hit
    sourceTitle: "How Valkyrae's Imaginary Relationship With a Killer Clown Became a Streaming Hit (Rolling Stone)"
    date: "May 2024"
  - text: "I pretty much tell them to treat it like a reality TV show that is unscripted."
    source: https://ca.rollingstone.com/culture/how-valkyraes-imaginary-relationship-with-a-killer-clown-became-a-streaming-hit
    sourceTitle: "How Valkyrae's Imaginary Relationship With a Killer Clown Became a Streaming Hit (Rolling Stone)"
    date: "May 2024"
