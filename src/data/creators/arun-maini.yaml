name: Arun Maini
known: Consumer tech explainers and reviews on YouTube (Mrwhosetheboss)
niche: tech
platforms: [youtube]
about: Arun Maini runs the Mrwhosetheboss channel, which covers smartphones and consumer tech. He started it as a teenager and filmed in his bedroom until the channel passed 20 million subscribers.
advice:
  - text: "It's literally: make a video. Doesn't matter if it's good or bad. Pay attention to the comments."
    source: https://www.aol.com/articles/youtuber-arun-maini-went-being-114500106.html
    sourceTitle: "How YouTuber Arun Maini went from being a shy kid with a camcorder to 21 million subscribers (Mashable)"
    date: "2025"
  - text: There's actually something very personable about the imperfection of it.
    source: https://www.aol.com/articles/youtuber-arun-maini-went-being-114500106.html
