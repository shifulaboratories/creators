name: Vanessa Lau
known: YouTube and Instagram videos on building a business as a content creator
niche: business
platforms: [youtube, instagram]
about: A former corporate social media manager who teaches creators and coaches how to turn content into a business. She sells courses and programs built from her own client work.
tools:
  - name: ManyChat
    use: Automated Instagram DMs that send a link when someone comments a keyword, which she used to sell a Notion template
    source: https://www.smartpassiveincome.com/session617
    sourceTitle: "SPI 617: The Formula for Finding an Audience and Generating Revenue with Vanessa Lau"
    date: "Oct 2022"
advice:
  - text: "Consistency breeds legitimacy."
    source: https://www.smartpassiveincome.com/session617
    sourceTitle: "SPI 617: The Formula for Finding an Audience and Generating Revenue with Vanessa Lau"
    date: "Oct 2022"
  - text: Use YouTube for discoverability and long-form trust, and Instagram for relationships. Most of her Instagram reach comes from Reels, while carousels and Stories nurture existing followers.
    quote: false
    source: https://www.smartpassiveincome.com/session617
    sourceTitle: "SPI 617: The Formula for Finding an Audience and Generating Revenue with Vanessa Lau"
    date: "Oct 2022"
  - text: Pin a "Start here" reel that explains what you offer and how to reach you, so your profile works as a landing page.
    quote: false
    source: https://www.smartpassiveincome.com/session617
    sourceTitle: "SPI 617: The Formula for Finding an Audience and Generating Revenue with Vanessa Lau"
    date: "Oct 2022"
  - text: Validate an offer with about three beta clients, collect testimonials, then sell at full price. Grow from one-on-one to group programs to a course.
    quote: false
    source: https://www.smartpassiveincome.com/session617
    sourceTitle: "SPI 617: The Formula for Finding an Audience and Generating Revenue with Vanessa Lau"
    date: "Oct 2022"
