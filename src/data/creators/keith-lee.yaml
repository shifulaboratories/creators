name: Keith Lee
known: Food reviews of small, local restaurants on TikTok
niche: short-form
platforms: [tiktok]
about: A former professional MMA fighter who reviews takeout from local, mostly family-run restaurants, usually filmed in his car and rated out of 10. His reviews often bring a rush of new customers to the places he features.
caseStudy: case-studies/keith-lee
advice:
  - text: "I don't shoot content, per se. I go get food, and people enjoy the originality."
    source: https://www.mashed.com/1212938/how-tiktoks-keith-lee-gained-millions-of-followers-reviewing-food-exclusive-interview
    sourceTitle: "How TikTok's Keith Lee gained millions of followers reviewing food (Mashed interview)"
    date: "Feb 2023"
  - text: "We listen to the locals."
    source: https://www.entrepreneur.com/leadership/keith-lee-has-17m-tiktok-followers-heres-how-he-got-there/500418
    sourceTitle: "Keith Lee has 17M TikTok followers. Here's how he got there (Entrepreneur)"
    date: "Dec 2025"
  - text: He avoids reviews that are intentionally negative, because small businesses are people's livelihoods. Working as a fighter, an independent contractor, kept him in a small-business mindset.
    quote: false
    source: https://www.entrepreneur.com/leadership/keith-lee-has-17m-tiktok-followers-heres-how-he-got-there/500418
    sourceTitle: "Keith Lee has 17M TikTok followers. Here's how he got there (Entrepreneur)"
    date: "Dec 2025"
