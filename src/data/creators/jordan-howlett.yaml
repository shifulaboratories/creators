name: Jordan Howlett
known: Short-form videos answering questions and sharing life hacks
niche: short-form
platforms: [youtube, tiktok, instagram]
about: Jordan Howlett started posting short videos while working a 9-to-5 job and grew into one of the best known creators on YouTube Shorts and TikTok.
advice:
  - text: "I usually know within the first hour if the video is going to do well or if the video is not."
    source: https://blog.youtube/creator-and-artist-stories/five-tips-to-master-shorts/
    sourceTitle: "Five tips to master Shorts (YouTube Official Blog)"
    date: "Aug 2025"
  - text: "I do think that there's a lot of benefit in just forging your own path, because those videos will last a lot longer."
    source: https://blog.youtube/creator-and-artist-stories/five-tips-to-master-shorts/
    sourceTitle: "Five tips to master Shorts (YouTube Official Blog)"
    date: "Aug 2025"
  - text: Trends are a good way to push yourself out of your comfort zone, but original ideas tend to last longer.
    quote: false
    source: https://blog.youtube/creator-and-artist-stories/five-tips-to-master-shorts/
    sourceTitle: "Five tips to master Shorts (YouTube Official Blog)"
    date: "Aug 2025"
  - text: Don't put on a persona. Viewers can see through it, so just be a normal person on camera.
    quote: false
    source: https://blog.youtube/creator-and-artist-stories/five-tips-to-master-shorts/
    sourceTitle: "Five tips to master Shorts (YouTube Official Blog)"
    date: "Aug 2025"
