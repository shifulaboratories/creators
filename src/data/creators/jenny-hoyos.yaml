name: Jenny Hoyos
known: Budget cooking and challenge videos on YouTube Shorts
niche: short-form
platforms: [youtube, tiktok, instagram]
about: Jenny Hoyos makes short, tightly scripted videos and is known for studying what makes Shorts work. She has spoken with YouTube's Shorts team about hooks and pacing.
advice:
  - text: "I really do think you have one second to hook someone, especially on Shorts."
    source: https://blog.youtube/creator-and-artist-stories/youtube-shorts-deep-dive/
    sourceTitle: "YouTube Shorts deep dive with Todd Sherman and Jenny Hoyos (YouTube Official Blog)"
    date: "Jan 2025"
  - text: Her hooks follow three steps, shock, intrigue and satisfy.
    quote: false
    source: https://blog.youtube/creator-and-artist-stories/youtube-shorts-deep-dive/
    sourceTitle: "YouTube Shorts deep dive with Todd Sherman and Jenny Hoyos (YouTube Official Blog)"
    date: "Jan 2025"
  - text: She builds a Short from small bits that each tell their own mini-story.
    quote: false
    source: https://blog.youtube/creator-and-artist-stories/youtube-shorts-deep-dive/
    sourceTitle: "YouTube Shorts deep dive with Todd Sherman and Jenny Hoyos (YouTube Official Blog)"
    date: "Jan 2025"
  - text: Thumbnails barely affect Shorts views, since nearly all views come from the Shorts feed, but they still matter for channel branding.
    quote: false
    source: https://blog.youtube/creator-and-artist-stories/youtube-shorts-deep-dive/
