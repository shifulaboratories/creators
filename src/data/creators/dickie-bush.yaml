name: Dickie Bush
known: Co-founder of Ship 30 for 30, a cohort program for writing online
niche: business
platforms: [x, newsletter]
site: https://www.ship30for30.com/
about: A former finance professional who grew an audience on X by writing daily, then co-founded Ship 30 for 30 with Nicolas Cole to teach people to write online.
tools:
  - name: Notion
    use: Keeps a database of every tweet idea he writes down
    source: https://podcast.creatorscience.com/dickie-bush/
    sourceTitle: "Dickie Bush: Building an audience, product, and community in less than one year (Creator Science, #51)"
    date: "Apr 2021"
  - name: Figma
    use: Designs the graphics for his atomic essays (or Canva)
    source: https://podcast.creatorscience.com/dickie-bush/
    sourceTitle: "Dickie Bush: Building an audience, product, and community in less than one year (Creator Science, #51)"
    date: "Apr 2021"
  - name: Circle
    use: Hosts the Ship 30 for 30 community, after it outgrew Slack
    source: https://podcast.creatorscience.com/dickie-bush/
    sourceTitle: "Dickie Bush: Building an audience, product, and community in less than one year (Creator Science, #51)"
    date: "Apr 2021"
advice:
  - text: Share a lot of ideas early to get immediate feedback, then keep doubling down on the ones that resonate.
    quote: false
    source: https://podcast.creatorscience.com/dickie-bush/
    sourceTitle: "Dickie Bush: Building an audience, product, and community in less than one year (Creator Science, #51)"
    date: "Apr 2021"
  - text: Don't worry too much about niching down at the start. Let testing narrow your topics.
    quote: false
    source: https://podcast.creatorscience.com/dickie-bush/
    sourceTitle: "Dickie Bush: Building an audience, product, and community in less than one year (Creator Science, #51)"
    date: "Apr 2021"
  - text: To build a writing habit, find a community that gives you accountability.
    quote: false
    source: https://podcast.creatorscience.com/dickie-bush/
    sourceTitle: "Dickie Bush: Building an audience, product, and community in less than one year (Creator Science, #51)"
    date: "Apr 2021"
