name: Brittany Xavier
known: Fashion and lifestyle content on Instagram and her blog Thrifts and Threads
niche: lifestyle
platforms: [instagram, youtube]
about: Brittany Xavier started the fashion blog Thrifts and Threads as a side project and grew it into a full-time business with luxury brand partners and her own capsule collection.
advice:
  - text: She plans each month's posts at the start of the month, including sponsored posts, trends and holidays, and never publishes two sponsored posts on the same day.
    quote: false
    source: https://www.entrepreneur.com/science-technology/style-influencer-brittany-xavier-built-a-community-of-more/325152
    sourceTitle: "Style Influencer Brittany Xavier Built a Community of More than 1 Million Followers (Entrepreneur)"
    date: "Dec 2018"
  - text: Make a rate card that prices featuring a specific item separately from letting a brand reuse the content on its own channels, and base rates on how much time and editing the job takes.
    quote: false
    source: https://www.entrepreneur.com/science-technology/style-influencer-brittany-xavier-built-a-community-of-more/325152
    sourceTitle: "Style Influencer Brittany Xavier Built a Community of More than 1 Million Followers (Entrepreneur)"
    date: "Dec 2018"
  - text: Batch shoots when locations are close together, and make each post look noticeably different from your last similar one.
    quote: false
    source: https://www.entrepreneur.com/science-technology/style-influencer-brittany-xavier-built-a-community-of-more/325152
    sourceTitle: "Style Influencer Brittany Xavier Built a Community of More than 1 Million Followers (Entrepreneur)"
    date: "Dec 2018"
  - text: Do not quit your job until the account has covered your salary consistently for several months.
    quote: false
    source: https://www.entrepreneur.com/science-technology/style-influencer-brittany-xavier-built-a-community-of-more/325152
    sourceTitle: "Style Influencer Brittany Xavier Built a Community of More than 1 Million Followers (Entrepreneur)"
    date: "Dec 2018"
