name: Lara Acosta
known: LinkedIn creator teaching personal branding and storytelling posts
niche: business
platforms: [linkedin, x]
about: A UK-based creator who grew one of the fastest-growing personal brands on LinkedIn with story-led posts. She runs a course on LinkedIn writing and a personal branding agency.
advice:
  - text: Keep your first line to about 8 to 10 words so it doesn't get cut off on mobile, and treat it like a YouTube title or thumbnail that sparks curiosity or excitement. Use the second line as a rehook.
    quote: false
    source: https://creatorscience.com/podcast/lara-acosta/
    sourceTitle: "Lara Acosta: How LinkedIn's fastest growing female creator uses the platform (Creator Science, Ep 241)"
    date: "Feb 2025"
  - text: Turn the how-to into a how-I. Lead with your own story, draw out the lesson, add actionable advice and close with a line that sums it up.
    quote: false
    source: https://creatorscience.com/podcast/lara-acosta/
    sourceTitle: "Lara Acosta: How LinkedIn's fastest growing female creator uses the platform (Creator Science, Ep 241)"
    date: "Feb 2025"
  - text: Start with three quality posts a week. After posting, block the next hour to reply to comments on your post, then spend time engaging with other people's content.
    quote: false
    source: https://creatorscience.com/podcast/lara-acosta/
    sourceTitle: "Lara Acosta: How LinkedIn's fastest growing female creator uses the platform (Creator Science, Ep 241)"
    date: "Feb 2025"
  - text: Pair a good image with your text. In her own 20-day test, photo-and-text posts grew her account more than video-only posts.
    quote: false
    source: https://creatorscience.com/podcast/lara-acosta/
    sourceTitle: "Lara Acosta: How LinkedIn's fastest growing female creator uses the platform (Creator Science, Ep 241)"
    date: "Feb 2025"
