name: Mikayla Nogueira
known: Makeup reviews and tutorials on TikTok, founder of Point of View
niche: beauty
platforms: [tiktok, instagram, youtube]
about: A makeup artist from Massachusetts who built a large TikTok audience with candid product reviews and tutorials. She later launched her own beauty brand, Point of View.
advice:
  - text: Build hype before a launch. She gets people talking and speculating for a stretch beforehand, then releases the product, a strategy she says she has used for five years.
    quote: false
