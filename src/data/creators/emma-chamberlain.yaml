name: Emma Chamberlain
known: Self-edited YouTube vlogs, the Anything Goes podcast and Chamberlain Coffee
niche: lifestyle
platforms: [youtube, podcast, instagram]
about: Emma Chamberlain built a following with fast-cut, self-edited YouTube vlogs, then moved into podcasting with Anything Goes. She also founded the brand Chamberlain Coffee.
caseStudy: case-studies/emma-chamberlain
advice:
  - text: "The key to turning something into a business is making it consistent, and I know I can be consistent with the podcast."
    source: https://www.fastcompany.com/90904004/emma-chamberlain-on-succeeding-as-a-creator
    sourceTitle: "Emma Chamberlain on succeeding as a creator (Fast Company)"
    date: "Jun 2023"
  - text: "If it came from your heart, you're excited about it, and you're passionate about it, it's a good idea, even if it fails."
    quote: false
    source: https://www.fastcompany.com/90904004/emma-chamberlain-on-succeeding-as-a-creator
    sourceTitle: "Emma Chamberlain on succeeding as a creator (Fast Company)"
    date: "Jun 2023"
  - text: Build something real with longevity instead of chasing virality. She also finds it hard to provide real value in short-form content.
    quote: false
    source: https://www.fastcompany.com/90904004/emma-chamberlain-on-succeeding-as-a-creator
    sourceTitle: "Emma Chamberlain on succeeding as a creator (Fast Company)"
    date: "Jun 2023"
  - text: She edited every vlog herself with no assistant editors, spending roughly 20 to 30 hours per video (down from 30 to 40 when she started), and developed a style that felt right to her rather than copying others.
    quote: false
    source: https://tubefilter.com/2019/06/10/emma-chamberlain-30-hours-editing-each-vlog/
    sourceTitle: "Emma Chamberlain says she spends up to 30 hours editing each vlog (Tubefilter)"
    date: "Jun 2019"
