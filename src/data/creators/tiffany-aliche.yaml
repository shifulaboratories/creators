advice:
  - text: "you can have zero people on social and have a decent email list and have a million dollar business."
    source: https://creatorscience.com/podcast/tiffany-aliche-the-budgetnista/
    sourceTitle: "Tiffany Aliche, The Budgetnista (Creator Science, Ep 24)"
    date: "Sep 2020"
  - text: Start with something free. Her business began as a free multi-week email course, the Live Richer Challenge, which she later turned into a book and a paid online school.
    quote: false
    source: https://creatorscience.com/podcast/tiffany-aliche-the-budgetnista/
    sourceTitle: "Tiffany Aliche, The Budgetnista (Creator Science, Ep 24)"
    date: "Sep 2020"
  - text: Treat press as a way to build authority and charge more, not as a direct sales channel. In her words, press begets more press.
