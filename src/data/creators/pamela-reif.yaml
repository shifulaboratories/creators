name: Pamela Reif
known: Home workout videos on YouTube, founder of Naturally Pam
niche: lifestyle
platforms: [youtube, instagram]
about: Pamela Reif is a German fitness creator known for follow-along home workouts on YouTube. She also founded the food brand Naturally Pam and runs a workout and recipe app.
advice:
  - text: She keeps a fixed publishing rhythm, with a new workout video every week, three new recipes in her app each week and new workout plans every other Sunday.
    quote: false
    source: https://omr.com/de/daily/pamela-reif-omr-podcast/
    sourceTitle: "Pamela Reif on the OMR Podcast (OMR, in German)"
    date: "Jun 2022"
  - text: She says she is not a perfectionist but holds high standards for aesthetics and quality, and credits that for her success because people trust that anything she releases is good.
    quote: false
    source: https://omr.com/de/daily/pamela-reif-omr-podcast/
    sourceTitle: "Pamela Reif on the OMR Podcast (OMR, in German)"
    date: "Jun 2022"
  - text: She deliberately avoids typical Instagram brand deals that pay large sums for a single post.
    quote: false
    source: https://omr.com/de/daily/pamela-reif-omr-podcast/
    sourceTitle: "Pamela Reif on the OMR Podcast (OMR, in German)"
    date: "Jun 2022"
