about: An Emmy-winning designer and former agency owner who founded The Futur, an online education company for creative professionals. He teaches pricing, branding and selling creative work on YouTube and in courses.
advice:
  - text: "rough, ugly video, with a good message is better than highly produced slick editing."
    source: https://creatorscience.com/podcast/chris-do/
    sourceTitle: "Chris Do (Creator Science, Ep 111)"
    date: "Aug 2022"
  - text: Show proof of results instead of claiming them. Clients won't trust claims you can't demonstrate.
    quote: false
    source: https://creatorscience.com/podcast/chris-do/
    sourceTitle: "Chris Do (Creator Science, Ep 111)"
    date: "Aug 2022"
  - text: Link your products directly from your videos. Adding YouTube product cards lifted his revenue by about 20 percent.
    quote: false
    source: https://creatorscience.com/podcast/chris-do/
    sourceTitle: "Chris Do (Creator Science, Ep 111)"
    date: "Aug 2022"
  - text: Mine your back catalog for short-form ideas. An intern doubled an Instagram account by pulling ideas from hundreds of hours of his existing content.
    quote: false
    source: https://creatorscience.com/podcast/chris-do/
    sourceTitle: "Chris Do (Creator Science, Ep 111)"
    date: "Aug 2022"
