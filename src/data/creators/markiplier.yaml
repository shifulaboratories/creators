name: Markiplier
known: Gaming and comedy YouTuber who self-funded the feature film Iron Lung
niche: gaming
platforms: [youtube]
about: Markiplier (Mark Fischbach) built one of YouTube's largest gaming channels and later wrote, directed and self-funded the horror film Iron Lung, released through his own studio.
advice:
  - text: I work hard to remember that the numbers aren't actually numbers.
    source: https://blog.youtube/creator-and-artist-stories/markiplier-iron-lung-interview/
    sourceTitle: "Markiplier on Iron Lung (YouTube Official Blog)"
    date: "Feb 2026"
  - text: Traditional deals often require you to surrender creative control.
    source: https://blog.youtube/creator-and-artist-stories/markiplier-iron-lung-interview/
    sourceTitle: "Markiplier on Iron Lung (YouTube Official Blog)"
    date: "Feb 2026"
  - text: You can build things of scale without needing to sell out 4,000 screens.
    source: https://blog.youtube/creator-and-artist-stories/markiplier-iron-lung-interview/
    sourceTitle: "Markiplier on Iron Lung (YouTube Official Blog)"
    date: "Feb 2026"
  - text: Know your limits on big projects. He felt he did too much himself on Iron Lung and would hand off more control next time.
    quote: false
    source: https://gizmodo.com/iron-lung-creator-markiplier-on-how-his-place-in-hollywood-has-evolved-2000779184
