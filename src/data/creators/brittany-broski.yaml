name: Brittany Broski
known: Comedy creator and host of the YouTube talk show Royal Court
niche: entertainment
platforms: [youtube, tiktok]
about: A comedian who first went viral on TikTok in 2019 and now hosts Royal Court, a celebrity interview show on YouTube. She has spoken about running her channel as a business and about how brands should work with creators.
advice:
  - text: "If you're going to hire a personality to promote your product, let them cook."
    source: https://blog.youtube/creator-and-artist-stories/brittany-broskis-brand-playbook/
    sourceTitle: "Brittany Broski's brand playbook (YouTube Official Blog)"
    date: "May 2025"
  - text: "It's not guaranteed that if you make $100,000 this month, you won't make zero for the rest of the year. You're running a business, and you need to act like it."
    quote: false
    source: https://blog.youtube/creator-and-artist-stories/brittany-broskis-brand-playbook/
    sourceTitle: "Brittany Broski's brand playbook (YouTube Official Blog)"
    date: "May 2025"
  - text: Real power comes from the community you bring together, not follower counts, which can be bought. Build an identifiable brand around authenticity and reliability.
    quote: false
    source: https://www.aol.com/social-media-star-brittany-broski-163108978.html
    sourceTitle: "Brittany Broski says the real power of content creators comes from community (Business Insider)"
    date: "Dec 2024"
  - text: She treats Royal Court as a regular talk show that happens to be on YouTube, and books it as a stop on celebrities' press tours, using early friendly guests to land bigger names.
    quote: false
    source: https://www.thewrap.com/brittany-broski-paul-mescal-royal-court-new-age-talk-show/
    sourceTitle: "How Brittany Broski booked Paul Mescal and elevated Royal Court (TheWrap)"
    date: "Nov 2025"
