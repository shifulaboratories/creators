name: Kris Collins
known: Scripted character sketches on TikTok and YouTube as Kallmekris
niche: short-form
platforms: [tiktok, youtube, instagram]
about: Kris Collins is a Canadian comedy creator who plays a rotating cast of about 30 recurring characters in scripted sketches. Brand deals are her main source of income.
advice:
  - text: "I'll just base the script off of usually one punch line or one joke, and I'll write it off of that."
    source: https://digiday.com/media/why-tiktok-creator-kris-collins-takes-a-scripted-approach-to-content-and-doesnt-rely-on-popular-trends-to-gain-followers/
    sourceTitle: "Why TikTok creator Kris Collins takes a scripted approach to content (Digiday)"
    date: "Apr 2022"
  - text: "I go through my comments every day to see what people are liking, what people aren't liking"
    source: https://digiday.com/media/why-tiktok-creator-kris-collins-takes-a-scripted-approach-to-content-and-doesnt-rely-on-popular-trends-to-gain-followers/
    sourceTitle: "Why TikTok creator Kris Collins takes a scripted approach to content (Digiday)"
    date: "Apr 2022"
  - text: She spaces out her recurring characters and rotates storylines so the same character does not show up again right away. About half of her characters came from audience suggestions.
    quote: false
    source: https://digiday.com/media/why-tiktok-creator-kris-collins-takes-a-scripted-approach-to-content-and-doesnt-rely-on-popular-trends-to-gain-followers/
    sourceTitle: "Why TikTok creator Kris Collins takes a scripted approach to content (Digiday)"
    date: "Apr 2022"
  - text: She uses trends only when she can add an original twist, and asks brands for full creative freedom so the product can be written into a skit.
