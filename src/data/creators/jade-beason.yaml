name: Jade Beason
known: YouTube videos on social media marketing and the creator business
niche: business
platforms: [youtube, instagram, podcast]
about: A UK-based former social media marketer who started a YouTube channel in November 2020 about marketing and entrepreneurship. She runs The Creator Project, which helps creators and entrepreneurs grow their audiences and income.
advice:
  - text: Set up the business side early. She started an email list in her second month using a quiz as a lead magnet, added affiliate links to videos, and built an e-book around the questions her analytics showed her audience asking.
    quote: false
    source: https://later.com/beyond-influence-podcast/episodes/jade-beason/
    sourceTitle: "Jade Beason: Creating Content That Gets You Paid (Later, Beyond Influence Ep 22)"
    date: "Sep 2024"
  - text: "A huge mistake of mine was not to get over that and start sharing short form content earlier than I did"
    source: https://later.com/beyond-influence-podcast/episodes/jade-beason/
    sourceTitle: "Jade Beason: Creating Content That Gets You Paid (Later, Beyond Influence Ep 22)"
    date: "Sep 2024"
  - text: Lean into your personality instead of toning it down, and leave small mistakes and quirks in your videos. Your personality is what sets you apart.
    quote: false
    source: https://later.com/beyond-influence-podcast/episodes/jade-beason/
    sourceTitle: "Jade Beason: Creating Content That Gets You Paid (Later, Beyond Influence Ep 22)"
    date: "Sep 2024"
  - text: Favor long-term brand partnerships with brands that tie directly to your content over one-off deals.
    quote: false
    source: https://later.com/beyond-influence-podcast/episodes/jade-beason/
    sourceTitle: "Jade Beason: Creating Content That Gets You Paid (Later, Beyond Influence Ep 22)"
    date: "Sep 2024"
