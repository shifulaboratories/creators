name: Kayla Itsines
known: Fitness trainer behind the BBG workouts and the Sweat app
niche: lifestyle
platforms: [instagram]
about: Kayla Itsines is an Australian personal trainer who built a large Instagram following around her Bikini Body Guides and co-founded the Sweat fitness app. She sold Sweat in 2021 and bought it back in 2023.
caseStudy: case-studies/kayla-itsines
advice:
  - text: "I'm still in my direct messages – there's 16 million people in there, and I'm in there every single day,"
    source: https://www.forbes.com.au/covers/entrepreneurs/im-the-boss-now-kayla-itsines-on-being-back-at-sweats-helm/
    sourceTitle: "Kayla Itsines on being back at Sweat's helm (Forbes Australia)"
    date: "Feb 2024"
  - text: She reads her DMs to learn what her community is talking about and what they need, then passes that to her team.
    quote: false
    source: https://www.forbes.com.au/covers/entrepreneurs/im-the-boss-now-kayla-itsines-on-being-back-at-sweats-helm/
    sourceTitle: "Kayla Itsines on being back at Sweat's helm (Forbes Australia)"
    date: "Feb 2024"
  - text: Her early growth came from followers posting their own transformation photos, which she calls free advertising that would cost money to reach today.
    quote: false
    source: https://www.forbes.com.au/covers/entrepreneurs/im-the-boss-now-kayla-itsines-on-being-back-at-sweats-helm/
    sourceTitle: "Kayla Itsines on being back at Sweat's helm (Forbes Australia)"
    date: "Feb 2024"
  - text: To grow in new countries, the team shows up in person and runs boot camps to learn what women there actually want.
