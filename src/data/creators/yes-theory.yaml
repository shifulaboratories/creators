name: Yes Theory
known: Travel and "seek discomfort" adventure videos on YouTube
niche: entertainment
platforms: [youtube, podcast]
about: Yes Theory is a YouTube channel started by a group of friends including Ammar Kandil, Thomas Brag and Matt Dajer. Their videos follow them saying yes to unusual challenges and meeting strangers around the world.
advice:
  - text: "build a community, not just an audience."
    source: https://musicbed.com/blog/?p=4308
    sourceTitle: "How Yes Theory found success and built 5 million subscribers (Musicbed)"
    date: "Jun 2020"
  - text: When starting out, make as much as you can and try lots of different styles. Editing, music and storytelling get more natural with volume, and many people quit before that point.
    quote: false
    source: https://musicbed.com/blog/?p=4308
    sourceTitle: "How Yes Theory found success and built 5 million subscribers (Musicbed)"
    date: "Jun 2020"
  - text: "What ends up happening is you take these inspirations, but then you make them your own."
    source: https://musicbed.com/blog/?p=4308
    sourceTitle: "How Yes Theory found success and built 5 million subscribers (Musicbed)"
    date: "Jun 2020"
  - text: New ideas often come from combining concepts from completely different places, and from putting yourself in situations that are unusual to you.
    quote: false
    source: https://thehustle.co/yes-theory-the-hustle-q-and-a
    sourceTitle: "Yes Theory Q&A (The Hustle)"
    date: "Oct 2024"
