name: Nischa Shah
known: Personal finance and self-development videos on YouTube
niche: business
platforms: [youtube]
about: A former investment banker and chartered accountant who started a YouTube channel about money and self-development in 2021. She left banking after the channel grew and now earns from YouTube, courses, talks and brand partnerships.
advice:
  - text: Post on a fixed schedule and keep going before results show up. She went to twice a week, every week, and took 11 months to reach 1,000 subscribers, then two months to reach 100,000.
    quote: false
    source: https://www.nbcmiami.com/news/business/money-report/an-investment-banker-quit-her-job-to-become-a-youtuber-and-now-makes-over-1-million/3357475/
    sourceTitle: "An investment banker quit her job to become a YouTuber and now makes over $1 million (CNBC Make It)"
    date: "Jul 2024"
  - text: "It's just literally the power of compounding in a nutshell, not knowing when that lucky break is going to be."
    source: https://www.nbcmiami.com/news/business/money-report/an-investment-banker-quit-her-job-to-become-a-youtuber-and-now-makes-over-1-million/3357475/
    sourceTitle: "An investment banker quit her job to become a YouTuber and now makes over $1 million (CNBC Make It)"
    date: "Jul 2024"
  - text: "When I talk to the camera, I think of it as I'm just talking to me when I was 22-years-old or 23-years-old,"
    source: https://www.nbcmiami.com/news/business/money-report/an-investment-banker-quit-her-job-to-become-a-youtuber-and-now-makes-over-1-million/3357475/
    sourceTitle: "An investment banker quit her job to become a YouTuber and now makes over $1 million (CNBC Make It)"
    date: "Jul 2024"
  - text: "I would advise, for as long as possible, to continue exploring side hustles or side businesses alongside a day job."
    source: https://www.nbcmiami.com/news/business/money-report/an-investment-banker-quit-her-job-to-become-a-youtuber-and-now-makes-over-1-million/3357475/
    sourceTitle: "An investment banker quit her job to become a YouTuber and now makes over $1 million (CNBC Make It)"
    date: "Jul 2024"
