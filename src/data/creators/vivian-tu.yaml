name: Vivian Tu
known: Your Rich BFF, personal finance explainers on TikTok and Instagram
niche: business
platforms: [tiktok, instagram, youtube, podcast, newsletter]
about: A former Wall Street trader who left JPMorgan and later BuzzFeed to make personal finance videos as Your Rich BFF. She posts short explainers across TikTok, Instagram and YouTube and runs the account full-time with a small team.
caseStudy: case-studies/vivian-tu
advice:
  - text: "it's not about who's going to give me the most money for one video, but who actually wants to grow this with me."
    source: https://www.retailtouchpoints.com/features/4-rules-for-maximizing-creator-investments-from-top-influencer-your-rich-bff/147787/
    sourceTitle: "4 Rules for Maximizing Creator Investments from Top Influencer Your Rich BFF (Retail TouchPoints)"
    date: "Oct 2024"
  - text: Structure brand contracts around more than one post. Hers can include paid time on set, content for her own channel, exclusivity and usage rights, and a bonus if the content outperforms.
    quote: false
    source: https://www.retailtouchpoints.com/features/4-rules-for-maximizing-creator-investments-from-top-influencer-your-rich-bff/147787/
    sourceTitle: "4 Rules for Maximizing Creator Investments from Top Influencer Your Rich BFF (Retail TouchPoints)"
    date: "Oct 2024"
  - text: "It's so hard to build trust and so easy to lose it, so I would never ever want to jeopardize my relationship with my audience"
    source: https://www.retailtouchpoints.com/features/4-rules-for-maximizing-creator-investments-from-top-influencer-your-rich-bff/147787/
    sourceTitle: "4 Rules for Maximizing Creator Investments from Top Influencer Your Rich BFF (Retail TouchPoints)"
    date: "Oct 2024"
  - text: Your audience has interests beyond your niche. A finance audience also cares about cooking, beauty and fashion, so mixing those into your content and partnerships can widen your reach.
    quote: false
    source: https://www.retailtouchpoints.com/features/4-rules-for-maximizing-creator-investments-from-top-influencer-your-rich-bff/147787/
    sourceTitle: "4 Rules for Maximizing Creator Investments from Top Influencer Your Rich BFF (Retail TouchPoints)"
    date: "Oct 2024"
