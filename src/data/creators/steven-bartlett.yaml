name: Steven Bartlett
known: Host of The Diary of a CEO podcast
niche: podcast
platforms: [podcast, youtube, instagram, linkedin]
about: An entrepreneur who co-founded the social media agency Social Chain and now hosts The Diary of a CEO, a long-form interview podcast published on YouTube and audio platforms. He runs the show with a team built around constant testing.
caseStudy: case-studies/steven-bartlett
advice:
  - text: "The goal is to get it wrong as many times as possible — because that's how you get it right."
    source: https://www.colinandsamir.com/resources/how-diary-of-a-ceo-became-youtubes-1-show
    sourceTitle: "How Diary of a CEO became YouTube's #1 Show (The Colin & Samir Show)"
    date: "Sep 2024 (approx.)"
  - text: Reward experiments, not just outcomes. His company has a dedicated team, led by a Head of Failure, whose job is to run as many tests as possible because more failures mean more learning.
    quote: false
    source: https://www.colinandsamir.com/resources/how-diary-of-a-ceo-became-youtubes-1-show
    sourceTitle: "How Diary of a CEO became YouTube's #1 Show (The Colin & Samir Show)"
    date: "Sep 2024 (approx.)"
  - text: Question standard practices like ad reads, hooks and calls to action. Rewording a clichéd subscribe call to action was credited with a roughly 300% increase in subscribers.
    quote: false
    source: https://www.colinandsamir.com/resources/how-diary-of-a-ceo-became-youtubes-1-show
    sourceTitle: "How Diary of a CEO became YouTube's #1 Show (The Colin & Samir Show)"
    date: "Sep 2024 (approx.)"
  - text: Test episodes before they go out. The team shows episodes to thousands of viewers before release, tracks where attention drops, and cuts based on the results.
    quote: false
    source: https://www.colinandsamir.com/resources/how-diary-of-a-ceo-became-youtubes-1-show
    sourceTitle: "How Diary of a CEO became YouTube's #1 Show (The Colin & Samir Show)"
    date: "Sep 2024 (approx.)"
