name: Corridor Crew
known: VFX breakdowns, short films and VFX Artists React on YouTube
niche: film
platforms: [youtube]
about: Corridor is a Los Angeles studio of filmmakers and visual effects artists co-founded by Niko Pueringer and Sam Gorski. It makes effects-heavy short films and shows about how visual effects work.
advice:
  - text: "I make it so I like it, so I would click on it and I would watch it"
    source: https://www.entrepreneur.com/science-technology/this-filmmaking-crew-found-success-on-youtube-making-shorts/318031
