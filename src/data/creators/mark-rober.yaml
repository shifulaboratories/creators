name: Mark Rober
known: Engineering stunts and science videos on YouTube, founder of CrunchLabs
niche: education
platforms: [youtube, instagram, tiktok]
about: Mark Rober is a former NASA and Apple engineer who makes large-scale engineering and science videos on YouTube. He also runs CrunchLabs, which sells build kits for kids.
advice:
  - text: Hide the lesson inside the stunt. Announcing a topic like magnetism up front bores people, so lead with the spectacle and let the learning happen along the way.
    quote: false
    source: https://www.jayshetty.me/blog/jay-shetty-mark-rober-on-how-to-turn-ideas-into-reality
    sourceTitle: "Mark Rober on how to turn ideas into reality (On Purpose with Jay Shetty)"
    date: "May 2026"
  - text: Treat storytelling as a core skill. The best engineers he saw at Apple were the ones who could communicate and move people emotionally.
    quote: false
    source: https://www.jayshetty.me/blog/jay-shetty-mark-rober-on-how-to-turn-ideas-into-reality
    sourceTitle: "Mark Rober on how to turn ideas into reality (On Purpose with Jay Shetty)"
    date: "May 2026"
  - text: Build the side project alongside a steady job. He kept working at Apple until his channel passed 10 million subscribers.
    quote: false
    source: https://www.jayshetty.me/blog/jay-shetty-mark-rober-on-how-to-turn-ideas-into-reality
    sourceTitle: "Mark Rober on how to turn ideas into reality (On Purpose with Jay Shetty)"
    date: "May 2026"
  - text: "The fact that you know it's real is what makes it crazy."
    source: https://www.entrepreneur.com/business-news/he-has-85-7-million-youtube-subscribers-this-is-how-to-differentiate-your-videos-from-ai-slop
    sourceTitle: "He has 85.7 million YouTube subscribers. This is how to differentiate your videos from AI slop (Entrepreneur)"
    date: "Nov 2026"
