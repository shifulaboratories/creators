name: Sam Parr
known: Founder of The Hustle newsletter and co-host of My First Million
niche: business
platforms: [newsletter, podcast, x]
about: The founder of The Hustle, a business newsletter he grew to about 2 million subscribers before selling it to HubSpot. He co-hosts the podcast My First Million.
tools:
  - name: Gumroad
    use: Took the first $50,000 in pre-sales for Trends, The Hustle's paid product
    source: https://nathanbarry.com/030-sam-parr-growing-2m-subscribers-selling-newsletter/
    sourceTitle: "Sam Parr: Growing to 2M Subscribers and Selling Your Newsletter (The Nathan Barry Show, Ep 30)"
    date: "Mar 2021"
  - name: Facebook Ads
    use: Paid subscriber acquisition for the newsletter
    source: https://nathanbarry.com/030-sam-parr-growing-2m-subscribers-selling-newsletter/
    sourceTitle: "Sam Parr: Growing to 2M Subscribers and Selling Your Newsletter (The Nathan Barry Show, Ep 30)"
    date: "Mar 2021"
advice:
  - text: Learn to write through copy work. Take writing you admire, such as long-form ads or comedy scripts, and copy it out word for word by hand so you notice the patterns.
    quote: false
    source: https://nathanbarry.com/030-sam-parr-growing-2m-subscribers-selling-newsletter/
    sourceTitle: "Sam Parr: Growing to 2M Subscribers and Selling Your Newsletter (The Nathan Barry Show, Ep 30)"
    date: "Mar 2021"
  - text: Most paid newsletters are underpriced. Charge more, push people toward annual billing, and use a long-form sales page as the homepage.
    quote: false
    source: https://nathanbarry.com/030-sam-parr-growing-2m-subscribers-selling-newsletter/
    sourceTitle: "Sam Parr: Growing to 2M Subscribers and Selling Your Newsletter (The Nathan Barry Show, Ep 30)"
    date: "Mar 2021"
  - text: Grow with co-registration, where partner sites offer your newsletter at sign-up, and pay only for engaged subscribers who actually open your emails.
    quote: false
    source: https://nathanbarry.com/030-sam-parr-growing-2m-subscribers-selling-newsletter/
    sourceTitle: "Sam Parr: Growing to 2M Subscribers and Selling Your Newsletter (The Nathan Barry Show, Ep 30)"
    date: "Mar 2021"
  - text: "If they paid money for it, they usually appreciate it."
    source: https://nathanbarry.com/030-sam-parr-growing-2m-subscribers-selling-newsletter/
    sourceTitle: "Sam Parr: Growing to 2M Subscribers and Selling Your Newsletter (The Nathan Barry Show, Ep 30)"
    date: "Mar 2021"
