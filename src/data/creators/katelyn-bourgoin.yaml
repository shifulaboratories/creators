name: Katelyn Bourgoin
known: Why We Buy, a newsletter on buyer psychology for marketers
niche: business
platforms: [newsletter, x]
about: A marketer and founder of Customer Camp who writes the Why We Buy newsletter about the psychology behind buying decisions. She sells research templates and training for marketers.
tools:
  - name: SparkLoop
    use: Added to her stack to run a newsletter referral program
    source: https://nathanbarry.com/?p=4852
    sourceTitle: "070: Katelyn Bourgoin, Stop Selling Courses & Start Selling These (Nathan Barry podcast)"
    date: "May 2022"
advice:
  - text: Remind people to subscribe the day before and the day of each issue. She calls consistent reminders her biggest growth driver.
    quote: false
    source: https://nathanbarry.com/?p=4852
    sourceTitle: "070: Katelyn Bourgoin, Stop Selling Courses & Start Selling These (Nathan Barry podcast)"
    date: "May 2022"
  - text: Pin your best thread and point it at your newsletter. Her pinned thread of buyer psychology lessons brought in about 2,400 sign-ups.
    quote: false
    source: https://nathanbarry.com/?p=4852
    sourceTitle: "070: Katelyn Bourgoin, Stop Selling Courses & Start Selling These (Nathan Barry podcast)"
    date: "May 2022"
  - text: Use your subscribe thank-you page as the first step to a product, with a question and a short webinar that lead to a paid offer. Her product sales rose once those steps were connected.
    quote: false
    source: https://nathanbarry.com/?p=4852
    sourceTitle: "070: Katelyn Bourgoin, Stop Selling Courses & Start Selling These (Nathan Barry podcast)"
    date: "May 2022"
  - text: For a busy audience, sell templates and checklists instead of long video courses.
    quote: false
    source: https://nathanbarry.com/?p=4852
    sourceTitle: "070: Katelyn Bourgoin, Stop Selling Courses & Start Selling These (Nathan Barry podcast)"
    date: "May 2022"
