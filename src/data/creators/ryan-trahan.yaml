name: Ryan Trahan
known: Challenge vlog series that raise millions for charity
niche: entertainment
platforms: [youtube]
about: Turned daily vlogs into multi-week challenge seasons, from a single penny to 50 states in 50 days, raising more than $11 million for St. Jude.
caseStudy: case-studies/ryan-trahan
advice:
  - text: "In many ways, this series was designed a lot like a traditional TV show. It gave viewers a predictable structure every day."
    source: https://blog.youtube/creator-and-artist-stories/ryan-trahan-50-states-50-days/
    sourceTitle: "How Ryan Trahan used his following to raise over $11 million for St. Jude (YouTube Official Blog)"
    date: "Aug 2025"
  - text: "I love gamifying otherwise mundane scenarios. It makes everything more fun!"
    source: https://blog.youtube/creator-and-artist-stories/ryan-trahan-50-states-50-days/
    sourceTitle: "YouTube Official Blog"
    date: "Aug 2025"
  - text: "That's the unique power of YouTube, you can be your authentic self, and your audience embraces that."
    source: https://blog.youtube/creator-and-artist-stories/ryan-trahan-50-states-50-days/
    sourceTitle: "YouTube Official Blog"
    date: "Aug 2025"
