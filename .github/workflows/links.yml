# Checks every link to another website once a week, so sources that move or
# disappear get fixed. Results land in the run's summary; a run with dead links
# fails so it shows up red on the Actions tab. Links to this site are checked on
# every pull request instead (scripts/check-links.mjs in ci.yml).
name: External links

on:
  schedule:
    - cron: '17 14 * * 1' # Mondays
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/links.yml']

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
 English pages only: translated pages carry the same links.node-version: 22
 English pages only: translated pages carry the same links.cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check links to other sites
        uses: lycheeverse/lychee-action@v2
        with:
 English pages only: translated pages carry the same links.# English pages only: translated pages carry the same links.
 English pages only: translated pages carry the same links.args: >-
 English pages only: translated pages carry the same links.  --scheme https --scheme http --no-progress --max-concurrency 8 --timeout 20 --max-retries 2
 English pages only: translated pages carry the same links.  --accept '200..=299,401,403,429,999'
 English pages only: translated pages carry the same links.  --exclude-path 'dist/es' --exclude-path 'dist/pt-br' --exclude-path 'dist/og'
 English pages only: translated pages carry the same links.  --exclude '^https://creators\.select' --exclude '^https?://localhost'
 English pages only: translated pages carry the same links.  --exclude '^https://(claude\.ai|chatgpt\.com|www\.perplexity\.ai)/'
 English pages only: translated pages carry the same links.  --exclude '^https://(x\.com|twitter\.com)/intent' --exclude '^https://www\.linkedin\.com/sharing'
 English pages only: translated pages carry the same links.  --exclude '^https://www\.threads\.net/intent' --exclude '^https://wa\.me/'
 English pages only: translated pages carry the same links.  --exclude '^https://(www\.)?(instagram|tiktok|facebook|linkedin)\.com/'
 English pages only: translated pages carry the same links.  --exclude '^https://i\.ytimg\.com/'
 English pages only: translated pages carry the same links.  'dist/**/*.html'
 English pages only: translated pages carry the same links.format: markdown
 English pages only: translated pages carry the same links.jobSummary: true
 English pages only: translated pages carry the same links.fail: true
