name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build validates every guide's frontmatter and every tool file against src/content.config.ts.
      - run: npm run build
      # Every link to a page, section or file on this site must exist (old addresses are in astro.config.mjs).
      - run: node scripts/check-links.mjs
