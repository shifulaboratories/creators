# Publishes a GitHub Release when a new version reaches main.
# The version comes from package.json; the notes from its CHANGELOG.md section.
# How releases are cut: docs/releasing.md.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release if this version has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released."; exit 0
          fi
          # The CHANGELOG section for this version, without its heading.
          node -e '
            const fs = require("fs"); const v = process.argv[1];
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = md.search(new RegExp("^## " + v.replace(/\./g, "\\.") + " · ", "m"));
            if (start < 0) { console.error("CHANGELOG.md has no section for " + v); process.exit(1); }
            const rest = md.slice(start);
            const end = rest.slice(3).search(/^## \d/m);
            const section = end < 0 ? rest : rest.slice(0, end + 3);
            const [head, ...body] = section.trim().split("\n");
            fs.writeFileSync("title.txt", "v" + v + (head.split(" · ")[2] ? " · " + head.split(" · ")[2] : ""));
            fs.writeFileSync("notes.md", body.join("\n").trim() + "\n\nOn the site: https://creators.select/changelog/#v" + v.replace(/\./g, "-") + "\n");
          ' "$V"
          gh release create "v$V" --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md --latest
