name: Site bug
description: Something on creators.select looks broken or doesn't work.
title: "Bug: "
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://creators.select/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
