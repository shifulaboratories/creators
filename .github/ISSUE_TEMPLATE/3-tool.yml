name: Tool suggestion
description: Add or update a tool on the Stack page.
title: "Tool: "
labels: [tool]
body:
  - type: input
    id: name
    attributes:
      label: Tool name and link
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it's for and why creators should know it
    validations:
      required: true
  - type: input
    id: alt
    attributes:
      label: Free or non-affiliate alternative
      description: Every pick on the site names one.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship with this tool
      options:
        - None, I just use it
        - I work for, invest in or am paid by it
        - I'd earn an affiliate commission
    validations:
      required: true
